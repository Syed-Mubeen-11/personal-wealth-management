<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Backend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .status-card {
            max-width: 400px;
            margin: 100px auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .transaction-icon {
            font-size: 3rem;
            color: #0d6efd;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="card status-card p-5">
        <div class="mb-4">
            <i class="fa-solid fa-right-left transaction-icon"></i>
        </div>
        <h2 class="fw-bold">Finance App</h2>
        <p class="text-muted">Status: <span class="badge bg-success">Backend is Running</span></p>
        <hr>
        <div class="d-flex justify-content-between px-3">
            <span>Server Time:</span>
            <span id="time" class="fw-bold"></span>
        </div>
    </div>
</div>

<script>
    // Simple script to show the current time
    document.getElementById('time').innerText = new Date().toLocaleTimeString();
</script>

</body>
</html>
