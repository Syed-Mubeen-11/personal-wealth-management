<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction</title>
</head>
<body>
    <h2>Add Transaction</h2>

    <form method="POST" action="/add_transaction">
        User ID: <input type="number" name="user_id"><br><br>

        Symbol: <input type="text" name="symbol"><br><br>

        Type:
        <select name="type">
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
            <option value="dividend">Dividend</option>
            <option value="contribution">Contribution</option>
            <option value="withdrawal">Withdrawal</option>
        </select><br><br>

        Quantity: <input type="number" step="any" name="quantity"><br><br>

        Price: <input type="number" step="any" name="price"><br><br>

        Fees: <input type="number" step="any" name="fees"><br><br>

        <button type="submit">Add Transaction</button>
    </form>
</body>
</html>
