## ─────────────────────────────────────────────────────────────────────────
##  .github/workflows/ci-cd.yml
##  Replaces Docker Compose for CI + deploys to Railway (or Render/Fly.io)
## ─────────────────────────────────────────────────────────────────────────
name: BE-2 CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # 1.  Lint & Unit Tests
  # ════════════════════════════════════════════════════════════════════════
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    # Spin up real Postgres + Redis as GitHub Actions services
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wealth
          POSTGRES_PASSWORD: wealth_pass
          POSTGRES_DB: wealth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wealth:wealth_pass@localhost:5432/wealth_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
      ALPHA_VANTAGE_KEY: dummy
      ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════
  # 2.  Integration smoke test (FastAPI + real DB)
  # ════════════════════════════════════════════════════════════════════════
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wealth
          POSTGRES_PASSWORD: wealth_pass
          POSTGRES_DB: wealth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://wealth:wealth_pass@localhost:5432/wealth_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
      ALPHA_VANTAGE_KEY: dummy
      ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt httpx

      - name: Run migrations + start API
        run: |
          alembic upgrade head
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Smoke-test endpoints
        run: |
          # Health check
          curl -f http://localhost:8000/health

          # Unauthenticated rebalance → 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/recommendations/rebalance)
          [ "$STATUS" = "401" ] && echo "✓ 401 on unauthenticated rebalance" || (echo "Expected 401, got $STATUS" && exit 1)

          # Unauthenticated PDF → 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/reports/pdf)
          [ "$STATUS" = "401" ] && echo "✓ 401 on unauthenticated PDF" || exit 1

          # Invalid CSV type → 422
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/api/v1/reports/csv?type=invalid")
          [ "$STATUS" = "422" ] && echo "✓ 422 on invalid CSV type" || exit 1

  # ════════════════════════════════════════════════════════════════════════
  # 3.  Deploy to Railway (triggered only on push to main)
  # ════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

      # ── Post-deploy migration ──────────────────────────────────────────
      - name: Run Alembic migrations on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service backend alembic upgrade head
